<!DOCTYPE html>
<html lang="en">
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="QUIK ERP - Enterprise Resource Platform">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QUIK ERP">
    <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">
    <link rel="icon" type="image/png" href="favicon.png?v=2"/>
    <title>QUIK ERP</title>
    <link rel="manifest" href="manifest.json?v=2">

    <style>
        /* Modern reset and enterprise typography */
        :root {
            --surface: #ffffff;
            --bg: #f8fafc; /* Very soft slate/grey background */
            --text-primary: #0f172a; /* Deep navy/slate for high contrast */
            --text-secondary: #475569; /* Professional grey */
            --text-tertiary: #64748b; /* Muted but readable */
            --border-light: #e2e8f0;
            --brand-blue: #0f62fe; /* Enterprise blue */
            --brand-cyan: #0891b2;
            --shadow-subtle: 0 4px 12px rgba(15, 23, 42, 0.03);
            --shadow-card: 0 2px 6px rgba(15, 23, 42, 0.02);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* -------------------------------------------------------------
           Premium Enterprise Background (Microsoft/Autodesk style)
           ------------------------------------------------------------- */
        .enterprise-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Soft ambient lighting */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
        }

        .glow-primary {
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(15, 98, 254, 0.06) 0%, transparent 70%);
        }

        .glow-secondary {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(8, 145, 178, 0.05) 0%, transparent 70%);
        }

        /* Ultra-light industrial CAD/Blueprint cross-grid pattern */
        .blueprint-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 18h-2v-2h2v2zm-2 2v2h-2v-2h2zm4 0h2v2h-2v-2zm0-4h2v2h-2v-2zm-6 4v2h-2v-2h2z' fill='%230f172a' fill-opacity='0.025' fill-rule='evenodd'/%3E%3C/svg%3E");
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 80%);
        }

        /* -------------------------------------------------------------
           Main Loader Container
           ------------------------------------------------------------- */
        #loader {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            animation: appFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* -------------------------------------------------------------
           Branding & Typography
           ------------------------------------------------------------- */
        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(var(--shadow-subtle));
            animation: floatLogo 5s ease-in-out infinite;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 28px;
        }

        .brand {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .subtitle {
            margin: 0;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .tagline {
            margin: 6px 0 0 0;
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        /* -------------------------------------------------------------
           Premium Module Cards (Dashboard Widget Style)
           ------------------------------------------------------------- */
        .module-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            max-width: 480px;
        }

        .module-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-card);
            border-left: 3px solid var(--accent);
            letter-spacing: 0.02em;
        }

        /* Subtle enterprise accent lines instead of dots */
        .m-crm { --accent: #2563eb; }
        .m-sales { --accent: #059669; }
        .m-service { --accent: #ea580c; }
        .m-quote { --accent: #7c3aed; }
        .m-inv { --accent: #0284c7; }

        /* -------------------------------------------------------------
           Progress Bar & Status
           ------------------------------------------------------------- */
        .loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .progress-track {
            width: 260px;
            height: 3px;
            background-color: var(--border-light);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }

        .progress-indicator {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            border-radius: 4px;
            /* Premium gradient with moving shine */
            background: linear-gradient(90deg, #0ea5e9 0%, #0f62fe 50%, #0ea5e9 100%);
            background-size: 200% 100%;
            box-shadow: 0 0 8px rgba(15, 98, 254, 0.3);
            animation:
                slideProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite,
                gradientShine 2s linear infinite;
        }

        .status-wrapper {
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .status-message {
            margin: 0;
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: opacity 0.4s ease;
        }

        /* -------------------------------------------------------------
           Security Badge
           ------------------------------------------------------------- */
        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 600;
            letter-spacing: 0.03em;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background: var(--surface);
            box-shadow: var(--shadow-card);
        }

        .security-badge svg {
            color: #059669; /* Trust/Success Green */
        }

        /* -------------------------------------------------------------
           Footer
           ------------------------------------------------------------- */
        .footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-tertiary);
            font-weight: 500;
            letter-spacing: 0.04em;
            z-index: 2;
        }

        /* -------------------------------------------------------------
           Animations & Accessibility
           ------------------------------------------------------------- */
        @keyframes appFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes slideProgress {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(300%); }
        }

        @keyframes gradientShine {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo { animation: none; }
            .progress-indicator { animation: slideProgress 4s linear infinite; }
            #loader { animation: none; opacity: 1; }
        }
    </style>
</head>

<body>
<div class="enterprise-bg" aria-hidden="true">
    <div class="ambient-glow glow-primary"></div>
    <div class="ambient-glow glow-secondary"></div>
    <div class="blueprint-overlay"></div>
</div>

<main id="loader" role="status" aria-live="polite">

    <img src="assets/images/logo.png" class="logo" alt="QUIK ERP Logo" />

    <div class="text-group">
        <h1 class="brand">QUIK ERP</h1>
        <p class="subtitle">Enterprise Resource Platform</p>
        <p class="tagline">Enterprise Manufacturing Suite</p>
    </div>

    <div class="module-grid" aria-label="Loading Modules">
        <div class="module-card m-crm">CRM</div>
        <div class="module-card m-sales">Sales</div>
        <div class="module-card m-service">Service</div>
        <div class="module-card m-quote">Quotation</div>
        <div class="module-card m-inv">Inventory</div>
    </div>

    <div class="loading-section">
        <div class="progress-track" aria-hidden="true">
            <div class="progress-indicator"></div>
        </div>

        <div class="status-wrapper">
            <p id="status-message" class="status-message">Initializing Workspace...</p>
        </div>

        <div class="security-badge" title="Secure Enterprise Connection">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Enterprise Grade &middot; Secure Connection
        </div>
    </div>
</main>

<footer class="footer">Powered by GenZ Protech</footer>

<script>
    (function() {
        // Rotating Status Messages Logic
        const statusEl = document.getElementById('status-message');
        const messages = [
            "Initializing Workspace...",
            "Loading CRM Module...",
            "Loading Inventory Module...",
            "Loading Service Module...",
            "Preparing Dashboard...",
            "Establishing Secure Connection..."
        ];
        let msgIndex = 0;

        const messageInterval = setInterval(() => {
            if (!statusEl) return;
            statusEl.style.opacity = '0';

            // Wait for fade out, then update text and fade in
            setTimeout(() => {
                msgIndex = (msgIndex + 1) % messages.length;
                statusEl.innerText = messages[msgIndex];
                statusEl.style.opacity = '1';
            }, 400);
        }, 1800);

        // Smooth Exit Transition when Flutter Renders
        window.addEventListener('flutter-first-frame', function () {
            clearInterval(messageInterval);

            const loaderEl = document.getElementById('loader');
            const bgLayer = document.querySelector('.enterprise-bg');
            const footerEl = document.querySelector('.footer');

            if (loaderEl) {
                // Apply exit transition
                loaderEl.style.transition = 'opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
                loaderEl.style.opacity = '0';
                loaderEl.style.transform = 'scale(1.02)';

                if(bgLayer) {
                    bgLayer.style.transition = 'opacity 0.7s ease';
                    bgLayer.style.opacity = '0';
                }

                if(footerEl) {
                    footerEl.style.transition = 'opacity 0.5s ease';
                    footerEl.style.opacity = '0';
                }

                // Safely remove elements from DOM after animation
                setTimeout(() => {
                    loaderEl.remove();
                    if(bgLayer) bgLayer.remove();
                    if(footerEl) footerEl.remove();
                }, 800);
            }
        });
    })();
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
