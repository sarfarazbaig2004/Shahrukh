name: QUIK
description: "QUIK - Professional CRM Workspace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  cloud_functions: ^5.0.0

  # Local storage
  shared_preferences: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Utilities
  intl: ^0.19.0
  file_picker: ^10.3.7
  crop_your_image: ^2.0.0
  provider: ^6.1.2
  fl_chart: ^0.66.0

  # PDF / Printing
  printing: ^5.14.2
  pdf: ^3.11.3

  # ✅ NEW (FOR PO UPLOADS & CUSTOMER VISIT GPS)
  flutter_image_compress: ^2.3.0
  url_launcher: ^6.2.5
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.2.2
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/memco_logo.png
    - assets/images/memco_watermark.png
    - assets/images/
